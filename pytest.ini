[pytest]
markers =
    slow: marks tests that sleep/wait on real wall-clock time (real server, real tick loop, or real network round trips) - excluded from `pytest -m "not slow"` for fast, deterministic day-to-day runs.
    requires_postgres: marks tests that need a real, reachable PostgreSQL instance (a real `postgresql://...` DSN that actually accepts a connection) - these skip cleanly (via a fixture that attempts a real connection and calls pytest.skip(...) on failure) rather than error, mirroring the `slow` marker's own "not every environment has the real infra available" precedent (Stage I0 found the Docker daemon itself unavailable in at least one real sandbox).
